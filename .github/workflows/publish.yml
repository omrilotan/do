name: Publish

on: [push]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm i
      - name: Format and sort
        run: |
          npm run format
          npm run sort
      - name: Commit auto fixes
        run: |
          if ! git diff --quiet; then
            git config user.email "${{ github.actor }}@users.noreply.github.com"
            git config user.name "${{ github.actor }}"
            git commit -am "😎 Autofix"
            git push origin HEAD:${{ github.ref }}
            exit 1
          fi
      - name: Test
        run: npm test
      - name: Clone site branch and clean everything
        if: github.ref == 'refs/heads/main'
        run: |
          git clone -b site --single-branch https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git docs
          find docs -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
      - name: Build
        if: github.ref == 'refs/heads/main'
        run: npm run build
      - name: Commit and push site
        if: github.ref == 'refs/heads/main'
        working-directory: docs
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git config user.name "${{ github.actor }}"
          git commit -m "Build ${{ github.sha }}"
          git push origin site
